<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes scanLine {
        0% { transform: translateY(-50px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateY(450px); opacity: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.05); }
      }
      @keyframes rotateShield {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .grid-bg { animation: pulseGrid 6s ease-in-out infinite; }
      .scanner-beam { animation: scanLine 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .node-float1 { animation: floatNode 4s ease-in-out infinite; }
      .node-float2 { animation: floatNode 5s ease-in-out 1s infinite; }
      .node-float3 { animation: floatNode 4.5s ease-in-out 2s infinite; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Cybernetic Grid (Dynamic Background) -->
  <rect width="1200" height="400" fill="url(#cyberGrid)" class="grid-bg"/>

  <!-- Glowing Background Orbs (Non-obstructive background glow) -->
  <circle cx="150" cy="100" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="250" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>

  <!-- Scanning Beam Animation (Background layer) -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGlow)" class="scanner-beam" filter="url(#glow)" opacity="0.7"/>

  <!-- Right Visual Elements: Abstract AI Security Nodes & Shield -->
  <g transform="translate(950, 190)">
    <!-- Floating Tech Nodes & Connections -->
    <line x1="-120" y1="-70" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="80" y1="-80" x2="0" y2="0" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="-60" y1="100" x2="0" y2="0" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- Orbital Node 1 -->
    <g class="node-float1" transform="translate(-120, -70)">
      <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">LLM</text>
    </g>

    <!-- Orbital Node 2 -->
    <g class="node-float2" transform="translate(80, -80)">
      <circle r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#818cf8" text-anchor="middle">MLOps</text>
    </g>

    <!-- Orbital Node 3 -->
    <g class="node-float3" transform="translate(-60, 100)">
      <circle r="22" fill="#0f172a" stroke="#c084fc" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">SPM</text>
    </g>

    <!-- Central Security Shield Badge -->
    <g filter="url(#glow)">
      <!-- Outer Hexagon Ring -->
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="3"/>
      <!-- Inner Shield Icon -->
      <path d="M 0 -30 L 25 -15 L 25 10 C 25 28 0 38 0 38 C 0 38 -25 28 -25 10 L -25 -15 Z" fill="url(#shieldGrad)" opacity="0.9"/>
      <!-- Lock / Check inside Shield -->
      <path d="M -8 2 L -2 8 L 10 -4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Left Header Foreground Text (Guaranteed 100% crisp foreground visibility) -->
  <g transform="translate(70, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 85)">
      <rect width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="15.1" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">
        🛡️ ENTERPRISE AI SECURITY &amp; GOVERNANCE
      </text>
    </g>

    <!-- Main Title (Graded & Glowing Foreground) -->
    <text x="0" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="url(#subtleGlow)">
      Awesome AI Security Posture
    </text>
    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGlow)" filter="url(#subtleGlow)">
      Management (AI-SPM) 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated Directory of Top Enterprise SaaS Platforms &amp; Open-Source Tools
    </text>

    <!-- Pillar Tags -->
    <g transform="translate(0, 320)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🔍 Model Scanning</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="167" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🎯 LLM Red Teaming</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="145" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="322" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🧱 Runtime Guardrails</text>

      <!-- Pill 4 -->
      <rect x="465" y="0" width="155" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="477" y="18" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">⚙️ Continuous Risk</text>
    </g>
  </g>
</svg>
